<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Legacy | Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="landing-page">
    <main class="landing-card">
        <div class="panel-heading">
            <p class="eyebrow">Career Builder</p>
            <h1>Cricket Legacy</h1>
        </div>

        <form action="/new_game" method="POST" class="career-form">
            <label class="field-label" for="username">Player Name</label>
            <input id="username" type="text" name="username" class="game-input" placeholder="Enter player name" required>

            <label class="field-label" for="date_of_birth">Date of Birth</label>
            <input id="date_of_birth" type="date" name="date_of_birth" class="game-input" max="{{ today }}" required>

            <label class="field-label" for="role">Primary Role</label>
            <select id="role" name="role" class="game-input">
                <option>Batsman</option>
                <option>Bowler</option>
                <option>All-Rounder</option>
                <option>Wicket-Keeper</option>
            </select>

            <label class="field-label" for="playing_style">Playing Style</label>
            <select id="playing_style" name="playing_style" class="game-input">
                <option>Calm Finisher</option>
                <option>Aggressive Opener</option>
                <option>Swing Specialist</option>
                <option>Mystery Spinner</option>
                <option>Safe Keeper</option>
                <option>Pressure Fielder</option>
            </select>

            <button type="submit" class="primary-btn submit-btn">Begin Journey</button>
        </form>

        {% if p %}
        <a href="/game" class="continue-link">Continue {{ p.name }}'s career</a>
        {% endif %}
    </main>
</body>
</html>
