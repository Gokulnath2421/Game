<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ scene_label }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="match-scene-page scene-{{ scenario.scene }}">
    <main class="match-scene-shell">
        <section class="scene-portrait" aria-hidden="true">
            <div class="player-silhouette"></div>
            <div class="scene-ground"></div>
        </section>

        <section class="decision-panel">
            <div class="decision-meta">
                <span>{{ scene_label }}</span>
                <span>Question {{ match.step + 1 }} of {{ match.questions | length }}</span>
            </div>

            <div class="panel-heading">
                <p class="eyebrow">{{ match.opponent }} | {{ match.pitch }}</p>
                <h1>{{ scenario.title }}</h1>
            </div>

            <p class="decision-context">{{ scenario.context }}</p>
            <p class="decision-question">{{ scenario.prompt }}</p>

            <form action="/match_choice" method="POST" class="decision-form">
                {% for option in scenario.choices %}
                <button type="submit" name="choice_index" value="{{ loop.index0 }}" class="choice-button">
                    {{ option.label }}
                </button>
                {% endfor %}
            </form>
        </section>
    </main>
</body>
</html>
