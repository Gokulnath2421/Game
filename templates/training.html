<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ training_type | title }} Training</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="focus-page">
    <main class="focus-card training-card">
        <div class="panel-heading">
            <p class="eyebrow">Daily Focus</p>
            <h1>{{ training_type | title }}</h1>
        </div>

        <div class="decision-results">
            {% for option in options %}
            <a class="training-option" href="/action/{{ training_type }}/{{ option.id }}">
                <span>{{ option.label }}</span>
                <p>{{ option.note }}</p>
                <small>Confidence {{ "%+d" | format(option.confidence) }} | Stress {{ "%+d" | format(option.stress) }} | Fitness {{ "%+d" | format(option.fitness) }}</small>
            </a>
            {% endfor %}
        </div>

        <a href="/game" class="continue-link">Back to career hub</a>
    </main>
</body>
</html>
